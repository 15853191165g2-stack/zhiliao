    <h1>2026年秋季学期本科生选课工作安排</h1>
    <span class="publish-date">发布时间：2026-10-04 16:20</span>
    <div class="v_news_content">
      <p>各学院：</p>
      <p>2026年秋季学期选课将于2026年10月20日12:00开放第一轮选课，10月27日12:00关闭选课系统进行抽签。本轮选课面向全体在校本科生。</p>
      <p>通识选修课每人限选2门，专业必修课由系统自动带入，不需要手动选择。选课系统地址：jw.example.edu.cn。</p>
      <p>如遇系统无法登录，请携带学生证到教务处信息科（行政楼208）现场处理，或拨打咨询电话：010-62789999。</p>
      <p>选课结果将于10月28日在教务处网站公示，请同学们自行查看。</p>
    </div>
  </div>
