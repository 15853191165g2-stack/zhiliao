# ============================================================================
# 微信公众号来源（大连理工大学 / DUT学生工作）
# ----------------------------------------------------------------------------
# ⚠️ 先把话说清楚：**微信没有公开接口**可以用来「获取某个公众号的最新文章列表」。
#    官方开放平台只给认证服务号开放「素材管理」等接口，且需要公众号主体授权，
#    第三方拿不到。所以这个文件里的东西默认全部关闭，请按需启用。
#
# 三条可行路线，按推荐度排序：
#
#   路线 A（推荐，已实现）：单篇链接导入
#       用户在微信里点「··· → 复制链接」，App 调 POST /api/import/article。
#       实测可直接抓到标题/正文/公众号名/发布时间，未触发风控。
#       缺点：一篇一篇导，不能自动发现新文章。
#
#   路线 B（可选，需自备桥接）：第三方 RSS 桥接
#       把公众号的文章列表转成 RSS，再用下面的 rss 适配器接。
#       ⚠️ 这类桥接服务：
#         - 大多是个人自建，随时可能停服或改域名
#         - 属于微信服务条款的灰色地带，账号有被封风险
#         - 所以**不内置任何第三方地址**，请自行评估后填入 bridge_url
#
#   路线 C：不接（保持现状）
#       后勤处、网信中心等站点会直接把公众号文章链接挂在自家列表里
#       （见 sources/dlut_org.yaml 里「后勤处·通知公告」），
#       等于学校帮你做了聚合，这条最省事且完全合规。
#
# 启用路线 B 的方法：把 enabled 改成 true，并把 bridge_url 换成你的桥接地址。
# 桥接地址一般长这样：https://your-bridge.example.com/wechat/<biz_id>.rss
# ============================================================================

- name: 公众号·DUT学生工作（RSS 桥接，需自填地址）
  school: 大连理工大学
  adapter: rss
  url: ""
  category_hint: 其他
  enabled: false          # ← 填好 bridge_url 后改成 true
  config:
    # ↓↓↓ 这里换成你自己的 RSS 桥接地址 ↓↓↓
    bridge_url: ""
    fetch_full_text: false
    max_items: 20
    charset: utf-8
    _note: "微信无公开接口，此处留空。填法见本文件顶部「路线 B」。"

- name: 公众号·大连理工大学（RSS 桥接，需自填地址）
  school: 大连理工大学
  adapter: rss
  url: ""
  category_hint: 其他
  enabled: false
  config:
    bridge_url: ""
    fetch_full_text: false
    max_items: 20
    charset: utf-8
    _note: "同上。也可以直接用「后勤处·通知公告」里的公众号直链，无需桥接。"
