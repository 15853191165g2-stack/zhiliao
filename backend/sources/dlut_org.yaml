# ---------------------------------------------------------------------------
# 图书馆（http://www.lib.dlut.edu.cn/）
# ---------------------------------------------------------------------------
# 结构：<li><a href="../info/1049/11319.htm">
#          <time class="time"><span>2026</span>09-22</time>
#          <h4 class="tit l2">标题</h4>
#          <span class="mor">了解详情</span>
#        </a></li>
#   - 年份和「月-日」被拆在同一个 <time> 里的两个节点：span + 纯文本，
#     取 `time.time` 得到「2026 09-22」，parse_dt 识别为「年份 月-日」形态
#   - 标题在 h4 里，所以标题选择器要写 h4.tit，不能用 a（否则会带上「了解详情」）
- name: 图书馆·通知公告
  school: 大连理工大学
  adapter: html_list
  url: http://www.lib.dlut.edu.cn/xw/tzgg.htm
  category_hint: 其他
  enabled: true
  # 实测：第1页 12 条
  config:
    list_selector: "ul.nytzlist.flex li"
    fields:
      title: "h4.tit"
      url: "a@href"
      date: "time.time"
    item_url_regex: "dlut\\.edu\\.cn/info/\\d+/\\d+\\.htm"
    follow_detail: true
    detail:
      content_selector: ["#vsb_content", ".v_news_content"]
    max_items: 20
    pagination:
      max_pages: 1

# ---------------------------------------------------------------------------
# 校团委（http://tuanwei.dlut.edu.cn）—— 默认关闭
# ---------------------------------------------------------------------------
# 实测：整站匿名访问返回「系统提示：抱歉，可能是由下列问题导致的：
#       您没有访问当前栏目的权限。」
# 这是博达的栏目权限控制，**不是选择器问题、也不是 UA 问题**，
# 换 UA / 加 Referer / 换 https 都无效。因此这里保留配置但默认禁用，
# 等拿到校内网或授权后再打开。替代方案见 docs/03-dlut-sources.md。
- name: 校团委·通知（需校内权限，默认关闭）
  school: 大连理工大学
  adapter: html_list
  url: http://tuanwei.dlut.edu.cn/
  category_hint: 活动
  enabled: false
  config:
    list_selector: "ul li"
    fields:
      title: "a"
      url: "a@href"
    item_url_regex: "tuanwei\\.dlut\\.edu\\.cn/info/\\d+/\\d+\\.htm"
    follow_detail: true
    detail:
      content_selector: ["#vsb_content", ".v_news_content"]
    max_items: 20
