# ---------------------------------------------------------------------------
# 盘锦校区图书馆
# ---------------------------------------------------------------------------
- name: 盘锦图书馆·新闻通知
  school: 大连理工大学
  adapter: html_list
  url: http://pjlib.dlut.edu.cn/xw/xwtz.htm
  category_hint: 后勤
  enabled: true
  # 实测 12 条。开放时间、闭馆、入馆考试、借阅规则都在这儿。
  # ⚠️ 这个站的结构是 <time class="time"><span>2026</span>09-23</time>：
  #    年份在 <span> 里、月日在后面裸文本，get_text 出来是「2026 09-23」。
  #    第一版正则只写了 2026-09-23 / 2026.09.23，匹配不到就 fallback 到整行，
  #    结果 12 条全被解析成页面别处的同一个日期（2025-10-17）——
  #    这种「日期不报错但全错」的情况，只能靠抓完看 min/max 发现。
  config:
    list_selector: "ul.nytzlist > li"
    fields:
      title: "h4"
      url: "a@href"
      date: "time"
    date_extract_regex: '20\d{2}\s+\d{1,2}-\d{1,2}'
    date_format: "%Y %m-%d"
    # a 里把日期（2026 09-23）和「了解详情」也包进去了，清掉
    title_cleanup_regex:
      - '^\d{4}\s+\d{1,2}-\d{1,2}\s+'
      - '\s*了解详情\s*$'
    item_url_regex: '/info/\d+/\d+\.htm'
    follow_detail: true
    detail:
      content_selector: ["#vsb_content", ".v_news_content"]
    max_items: 20

