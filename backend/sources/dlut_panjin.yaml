# ---------------------------------------------------------------------------
# 国际合作与交流处 / 档案馆（校级，盘锦学生也会用到）
# ---------------------------------------------------------------------------
- name: 国际合作与交流处·通知公告
  school: 大连理工大学
  adapter: html_list
  url: http://dutdice.dlut.edu.cn/gatjl/tzgg/tzgg.htm
  category_hint: 活动
  enabled: true
  # 实测 20 条，但最新一条是 2021 年 —— 该栏目更新极慢，交换项目多在
  # 「项目管理」等栏目。保留是为了不漏掉公派/交换的重大通知。
  # ⚠️ 这里不能用裸的 `ul > li`：页面上有 100+ 个 li，绝大多数是导航菜单，
  #    实测会抓出 111 条「首页 / 机构设置」。必须锚到 `div.list01`。
  config:
    list_selector: "div.list01 > div > ul > li"
    fields:
      title: "a"
      url: "a@href"
      date: "span.date"
    date_extract_regex: '20\d{2}[-/]\d{1,2}[-/]\d{1,2}'
    item_url_regex: 'dutdice\.dlut\.edu\.cn/'
    follow_detail: true
    detail:
      content_selector: ["#vsb_content", ".v_news_content"]
    max_items: 20

