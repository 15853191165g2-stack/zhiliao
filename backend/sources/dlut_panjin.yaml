  school: 大连理工大学
  adapter: html_list
  url: http://pjteach.dlut.edu.cn/jxyx/kcyxkgl.htm
  category_hint: 教务
  enabled: true
  # 实测 5 条
  config:
    list_selector: 'div.space-y-6 > a[id^="line_"]'
    fields:
      title: "h3"
      url: "@href"
    date_extract_regex: '\d{1,2}\s+20\d{2}-\d{1,2}'
    date_format: "%d %Y-%m"
    item_url_regex: '/info/\d+/\d+\.htm'
    follow_detail: true
    detail:
